{% extends "base.html" %}
{% block content %}
  <div class="login-hero">
    <div class="login-card">
      <h1 style="border-bottom:none; padding-bottom:0">Giriş Yap</h1>
      <p class="sub" style="margin-bottom:26px">Ataşman Otomasyonu'na devam etmek için kullanıcı adınız ve
        şifrenizle giriş yapın.</p>

      <form action="{{ url_for('giris') }}" method="post">
        <input type="hidden" name="next" value="{{ next_url or '' }}">
        <label for="kullanici_adi">Kullanıcı adı</label>
        <input type="text" id="kullanici_adi" name="kullanici_adi" required autofocus>

        <label for="sifre">Şifre</label>
        <input type="password" id="sifre" name="sifre" required>

        <div style="margin-top:22px"><button type="submit" style="width:100%">Giriş Yap</button></div>
      </form>
      <p class="hint" style="margin-top:16px; text-align:center">
        <a href="{{ url_for('sifre_unuttum') }}">Şifremi unuttum</a>
      </p>
    </div>
    <p class="hint" style="text-align:center; margin-top:18px">
      Hesabınız yok mu? Yöneticinizle iletişime geçin.
    </p>
  </div>
{% endblock %}
