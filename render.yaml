# Render "Blueprint" -- Render'da "New +" > "Blueprint" seçilip bu repo
# gösterildiğinde, aşağıdaki her şeyi (web servisi + kalıcı disk + gizli
# anahtar) otomatik olarak tek seferde kurar. Elle tek tek alan doldurmaya
# gerek kalmaz. Ayrıntılar için README'nin "Yayına alma (Render)" bölümüne
# bakın.
services:
  - type: web
    name: atasman-otomasyon
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    # Faz 1.11: varsayılan gunicorn worker timeout'u (30 saniye) büyük bir
    # imar planı altlığı (arka plan DXF'i, yüzlerce MB olabiliyor) yüklenirken
    # yetersiz kalıp "WORKER TIMEOUT" ile isteği öldürüyordu (kullanıcının
    # gördüğü "Internal Server Error" beyaz ekranın gerçek nedeni buydu --
    # Render loglarında doğrulandı). 300 saniyeye çıkarıldı.
    startCommand: "gunicorn wsgi:app --timeout 300"
    envVars:
      # rastgele, güvenli bir değerle Render kendisi oluşturur -- elle
      # girmeye gerek yok
      - key: SECRET_KEY
        generateValue: true
      # aşağıdaki disk'in mount edildiği yer; db.py bu yola SQLite dosyasını
      # yazar (bkz. app/core/config.py::DB_PATH)
      - key: DATA_DISK_PATH
        value: /data
    disk:
      name: atasman-data
      mountPath: /data
      sizeGB: 1
